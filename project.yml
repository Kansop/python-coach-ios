name: PythonCoach
options:
  bundleIdPrefix: com.pythoncoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PythonCoach:
    type: application
    platform: iOS
    sources:
      - path: PythonCoach
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pythoncoach.app
        PRODUCT_NAME: PythonCoach
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PythonCoach/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - PythonCoachTests
  PythonCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PythonCoachTests
    dependencies:
      - target: PythonCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pythoncoach.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PythonCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PythonCoach"
        BUNDLE_LOADER: "$(TEST_HOST)"
